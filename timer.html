<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Timer</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:#1e293b;
padding:30px;
border-radius:20px;
text-align:center;
width:320px;
}

h1{
color:#38bdf8;
}

#time{
font-size:60px;
margin:25px 0;
font-weight:bold;
}

button{
padding:12px 20px;
margin:5px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<div class="card">

<h1>⏱ Study Timer</h1>

<div id="time">25:00</div>

<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

</div>

<script>

let minutes=25;
let seconds=0;
let timer;

function updateTime(){
document.getElementById("time").innerHTML=
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");
}

function startTimer(){

clearInterval(timer);

timer=setInterval(function(){

if(seconds==0){

if(minutes==0){

clearInterval(timer);
alert("🎉 Study Session Complete!");
return;

}

minutes--;
seconds=59;

}else{

seconds--;

}

updateTime();

},1000);

}

function pauseTimer(){

clearInterval(timer);

}

function resetTimer(){

clearInterval(timer);

minutes=25;
seconds=0;
updateTime();

}

updateTime();

</script>

</body>
</html>
