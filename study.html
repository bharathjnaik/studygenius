<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyGenius AI - Notes</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

.container{
max-width:500px;
margin:30px auto;
padding:20px;
background:#1e293b;
border-radius:20px;
}

h1{
text-align:center;
color:#38bdf8;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:14px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.note{
background:#334155;
padding:15px;
margin-top:15px;
border-radius:12px;
}

.note h3{
margin:0;
color:#38bdf8;
}

.delete{
background:#ef4444;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>📝 My Notes</h1>

<input type="text" id="title" placeholder="Note Title">

<textarea id="content" placeholder="Write your notes here..."></textarea>

<button onclick="addNote()">Save Note</button>

<div id="notesList"></div>

</div>

<script>

function addNote(){

let title=document.getElementById("title").value;
let content=document.getElementById("content").value;

if(title=="" || content==""){
alert("Please enter title and note.");
return;
}

let note=document.createElement("div");
note.className="note";

note.innerHTML=
"<h3>"+title+"</h3>"+
"<p>"+content+"</p>"+
"<button class='delete' onclick='this.parentElement.remove()'>Delete</button>";
<a href="dashboard.html">🏠 Back to Dashboard</a>
