<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyGenius AI - Settings</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

.container{
max-width:500px;
margin:30px auto;
padding:20px;
background:#1e293b;
border-radius:20px;
}

h1{
text-align:center;
color:#38bdf8;
margin-bottom:20px;
}

.setting{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
margin:10px 0;
background:#334155;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

select{
padding:8px;
border-radius:8px;
border:none;
}
</style>
</head>

<body>

<div class="container">

<h1>⚙️ Settings</h1>

<div class="setting">
<span>🌙 Theme</span>
<select>
<option>Dark</option>
<option>Light</option>
</select>
</div>

<div class="setting">
<span>🔔 Notifications</span>
<input type="checkbox" checked>
</div>

<div class="setting">
<span>🌐 Language</span>
<select>
<option>English</option>
<option>Kannada</option>
<option>Hindi</option>
</select>
</div>

<div class="setting">
